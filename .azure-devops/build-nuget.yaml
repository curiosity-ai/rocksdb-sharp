trigger:
- master

# Packs the NuGet package from the native libraries built by the
# build-native-linux / build-native-mac / build-native-win pipelines. Nothing
# here comes from the rocksdbjni Maven artifacts any more: every binary in the
# package is produced by build-native/ in this repository.

pool:
  vmImage: 'ubuntu-22.04'

steps:

- task: Bash@3
  displayName: 'Compute package version'
  inputs:
    targetType: 'inline'
    script: |
      ROCKSDBVNUM=`cat rocksdbversion`
      ROCKSDBVERSIONFORPACKAGE="${ROCKSDBVNUM}"
      buildID=$BUILD_BUILDID
      modBuildID=$((buildID % 65536))  # ensure fits in int16
      echo "##vso[task.setvariable variable=ROCKSDBVERSION]${ROCKSDBVNUM}.${modBuildID}"
      echo "##vso[task.setvariable variable=ROCKSDBVERSIONBASE]${ROCKSDBVNUM}"
      # If version matches pattern like 10.10.1.1 → trim to first 3 parts
      if [[ "${ROCKSDBVNUM}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
        ROCKSDBVERSIONFORPACKAGE="${BASH_REMATCH[1]}"
      fi

      echo "##vso[task.setvariable variable=ROCKSDBVERSIONFORPACKAGE]${ROCKSDBVERSIONFORPACKAGE}.${modBuildID}"
    workingDirectory: '$(Build.SourcesDirectory)'

- task: NuGetToolInstaller@1

- task: UseDotNet@2
  displayName: 'Use .NET 10.0 sdk'
  inputs:
    packageType: sdk
    version: 10.x
    includePreviewVersions: false
    installationPath: $(Agent.ToolsDirectory)/dotnet

- template: templates/download-native.yaml
  parameters:
    rid: win-x64
    files:
    - rocksdb.dll

- template: templates/download-native.yaml
  parameters:
    rid: linux-x64
    files:
    - librocksdb.so
    - librocksdb-jemalloc.so
    - librocksdb-musl.so

- template: templates/download-native.yaml
  parameters:
    rid: linux-arm64
    files:
    - librocksdb.so
    - librocksdb-musl.so

- template: templates/download-native.yaml
  parameters:
    rid: osx-x64
    files:
    - librocksdb.dylib

- template: templates/download-native.yaml
  parameters:
    rid: osx-arm64
    files:
    - librocksdb.dylib

- task: Bash@3
  displayName: 'Check native libraries'
  inputs:
    targetType: 'inline'
    script: |
      set -e
      status=0
      for lib in $(find csharp/runtimes -type f); do
        size=$(stat -c%s "$lib")
        # The files checked into git are small placeholders; anything that small
        # means a download silently did not happen.
        if [ "$size" -lt 100000 ]; then
          echo "##vso[task.logissue type=error]${lib} is only ${size} bytes, the native library was not downloaded"
          status=1
        else
          echo "$(file -b "$lib" | cut -d, -f1-2) -- ${lib} (${size} bytes)"
        fi
      done
      exit $status
    workingDirectory: '$(Build.SourcesDirectory)'

- task: DotNetCoreCLI@2
  displayName: 'Generate C# bindings'
  inputs:
    command: 'run'
    projects: '$(Build.SourcesDirectory)/build-codegen/CSharpGen.csproj'
    workingDirectory: '$(Build.SourcesDirectory)/build-codegen/'

- task: DotNetCoreCLI@2
  displayName: 'Build RocksDbSharp'
  inputs:
    command: 'build'
    projects: '$(Build.SourcesDirectory)/csharp/RocksDbSharp.csproj'
    workingDirectory: '$(Build.SourcesDirectory)/csharp/'
    arguments: '-c Release /p:Version=$(ROCKSDBVERSIONFORPACKAGE) /p:AllowUnsafeBlocks=True /p:LangVersion=latest'

- task: DotNetCoreCLI@2
  displayName: 'Pack'
  inputs:
    command: 'pack'
    nobuild: true
    packagesToPack: '$(Build.SourcesDirectory)/csharp/RocksDbSharp.csproj'
    configuration: 'Release'
    versioningScheme: 'off'

- task: NuGetCommand@2
  displayName: 'Push to NuGet'
  inputs:
    command: 'push'
    packagesToPush: '**/*.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'
