trigger:
- master

pool:
  vmImage: 'windows-latest'

steps:

- template: templates/set-rocksdb-version.yaml

- task: CmdLine@2
  displayName: 'Build rocksdb.dll'
  inputs:
    # The build needs cl.exe, msbuild and the Windows SDK on PATH, which is what
    # vsdevcmd sets up; the build itself then runs under git bash.
    script: |
      call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\vsdevcmd" -arch=x64 && bash build-rocksdb-windows.sh
    workingDirectory: '$(Build.SourcesDirectory)/build-native/'

- template: templates/publish-native.yaml
  parameters:
    rid: win-x64
    files:
    - rocksdb.dll
