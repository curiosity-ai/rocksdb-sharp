trigger:
- master

# Builds both macOS slices from a single agent. build-rocksdb-macos.sh compiles
# zlib/bzip2/snappy/lz4/zstd from source for each architecture and links them in
# statically, so there is nothing to install with Homebrew here and no
# install_name_tool fixups afterwards.
#
# arm64 is built first, so a failure there stops the run before the x64 slice
# is attempted.

pool:
  vmImage: 'macOS-latest'

steps:

- template: templates/set-rocksdb-version.yaml

- task: Bash@3
  displayName: 'Build librocksdb.dylib for arm64 and x64'
  inputs:
    filePath: '$(Build.SourcesDirectory)/build-native/build-rocksdb-macos.sh'
    arguments: '--arch all'
    workingDirectory: '$(Build.SourcesDirectory)/build-native/'

- template: templates/publish-native.yaml
  parameters:
    rid: osx-arm64
    files:
    - librocksdb.dylib

- template: templates/publish-native.yaml
  parameters:
    rid: osx-x64
    files:
    - librocksdb.dylib
